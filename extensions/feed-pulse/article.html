<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedPulse - Reader</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f8fa;
      --text: #1a1d21;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --border: #dadce0;
      --accent: #4285f4;
    }

    [data-theme="dark"] {
      --bg: #1a1d21;
      --bg-secondary: #202428;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-muted: #5f6368;
      --border: #3c4043;
      --accent: #8ab4f8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 150ms;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-secondary);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 150ms;
    }

    .icon-btn:hover {
      background: var(--bg-secondary);
      color: var(--text);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-info {
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 8px;
    }

    .progress-bar {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      z-index: 99;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 100ms;
    }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .article-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
      color: var(--text);
    }

    .article-meta {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .article-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .article-body {
      font-size: 17px;
      line-height: 1.75;
      color: var(--text);
    }

    .article-body.reader-mode {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 19px;
      line-height: 1.85;
    }

    .article-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 20px 0;
    }

    .article-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .article-body a:hover {
      text-decoration: underline;
    }

    .article-body p {
      margin-bottom: 20px;
    }

    .article-body h1, .article-body h2, .article-body h3, .article-body h4 {
      margin-top: 28px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .article-body pre {
      background: var(--bg-secondary);
      padding: 16px 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .article-body code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .article-body pre code {
      background: none;
      padding: 0;
    }

    .article-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 20px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .article-body ul, .article-body ol {
      margin-bottom: 20px;
      padding-left: 28px;
    }

    .article-body li {
      margin-bottom: 6px;
    }

    .article-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .article-body th, .article-body td {
      padding: 10px 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .article-body th {
      background: var(--bg-secondary);
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: var(--text);
      color: var(--bg);
      border-radius: 8px;
      font-size: 13px;
      z-index: 200;
      animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="back-btn" class="icon-btn" title="Back to feed">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="toolbar-title">FeedPulse</span>
    </div>
    <div class="toolbar-right">
      <div class="nav-group">
        <button id="prev-btn" class="icon-btn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="nav-info" class="nav-info">1 / 10</span>
        <button id="next-btn" class="icon-btn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button id="bookmark-btn" class="icon-btn" title="Bookmark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="reader-mode-btn" class="icon-btn" title="Toggle reader mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </button>
      <button id="open-btn" class="btn btn-primary" title="Open original">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Original
      </button>
      <button id="share-btn" class="icon-btn" title="Copy link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="content" id="article-content">
    <h1 class="article-title" id="article-title">Loading...</h1>
    <div class="article-meta" id="article-meta"></div>
    <div class="article-body" id="article-body"></div>
  </div>

  <script src="article.js"></script>
</body>
</html>
