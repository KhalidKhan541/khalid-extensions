<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>FeedPulse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <div class="header-left">
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <h1 class="logo">FeedPulse</h1>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search articles..." autocomplete="off">
          <kbd>Ctrl+K</kbd>
        </div>
      </div>
      <div class="header-right">
        <button id="refresh-btn" class="icon-btn" title="Refresh all feeds">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2>Feeds</h2>
          <button id="add-feed-btn" class="btn btn-primary btn-sm" title="Add feed">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Add
          </button>
        </div>

        <div class="sidebar-nav">
          <button class="nav-item active" data-view="all">
            <span class="nav-icon">📰</span>
            <span class="nav-label">All Articles</span>
            <span id="all-unread" class="badge">0</span>
          </button>
          <button class="nav-item" data-view="unread">
            <span class="nav-icon">🔴</span>
            <span class="nav-label">Unread</span>
            <span id="unread-count" class="badge badge-red">0</span>
          </button>
          <button class="nav-item" data-view="bookmarks">
            <span class="nav-icon">⭐</span>
            <span class="nav-label">Bookmarks</span>
          </button>
        </div>

        <div class="sidebar-folders" id="folders-container"></div>
        <div class="sidebar-feeds" id="feeds-container"></div>

        <div class="sidebar-footer">
          <button id="manage-feeds-btn" class="btn btn-ghost btn-sm btn-full">Manage Feeds</button>
          <button id="import-export-btn" class="btn btn-ghost btn-sm btn-full">Import / Export</button>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div class="content-header-left">
            <h2 id="current-view-title">All Articles</h2>
            <span id="article-count" class="text-muted"></span>
          </div>
          <div class="content-header-right">
            <select id="sort-select" class="select-sm">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
            <button id="mark-all-read-btn" class="btn btn-ghost btn-sm">Mark all read</button>
          </div>
        </div>

        <div id="article-list" class="article-list">
          <div id="empty-state" class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>No articles yet</h3>
            <p>Add some RSS feeds to get started</p>
            <button id="empty-add-feed-btn" class="btn btn-primary">Add your first feed</button>
          </div>
        </div>

        <div id="reader-panel" class="reader-panel hidden">
          <div class="reader-header">
            <button id="close-reader-btn" class="icon-btn" title="Close reader">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div class="reader-nav">
              <button id="prev-article-btn" class="icon-btn" title="Previous article">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span id="reader-position" class="text-muted">1 / 10</span>
              <button id="next-article-btn" class="icon-btn" title="Next article">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
            <div class="reader-actions">
              <button id="reader-bookmark-btn" class="icon-btn" title="Bookmark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </button>
              <button id="reader-open-btn" class="icon-btn" title="Open original">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </button>
              <button id="reader-share-btn" class="icon-btn" title="Copy link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              </button>
              <button id="reader-reader-mode-btn" class="icon-btn" title="Reader mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              </button>
            </div>
          </div>
          <div id="reading-progress" class="reading-progress"></div>
          <div id="reader-content" class="reader-content">
            <h1 id="reader-title" class="reader-title"></h1>
            <div id="reader-meta" class="reader-meta"></div>
            <div id="reader-body" class="reader-body"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Feed Modal -->
  <div id="add-feed-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Feed</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="feed-url-input">Feed URL</label>
          <div class="input-row">
            <input type="url" id="feed-url-input" placeholder="https://example.com/feed.xml" class="input">
            <button id="detect-feed-btn" class="btn btn-ghost" title="Detect feed from current tab">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Auto-detect
            </button>
          </div>
        </div>
        <div id="detected-feeds" class="detected-feeds hidden">
          <h3>Detected feeds</h3>
          <div id="detected-feeds-list"></div>
        </div>
        <div class="form-group">
          <label for="feed-title-input">Feed Title (optional)</label>
          <input type="text" id="feed-title-input" placeholder="Auto-detected" class="input">
        </div>
        <div class="form-group">
          <label for="feed-folder-select">Folder</label>
          <select id="feed-folder-select" class="input"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Cancel</button>
        <button id="add-feed-confirm" class="btn btn-primary">Add Feed</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Poll Interval (minutes)</label>
          <input type="number" id="poll-interval" min="5" max="120" value="15" class="input">
        </div>
        <div class="form-group">
          <label>Max articles per feed</label>
          <input type="number" id="max-articles" min="10" max="500" value="100" class="input">
        </div>
        <div class="form-group">
          <label>Article retention (days)</label>
          <input type="number" id="retention-days" min="1" max="365" value="30" class="input">
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="show-notifications" checked>
            Show notifications for new articles
          </label>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="open-in-reader" checked>
            Open articles in reader view
          </label>
        </div>
        <hr>
        <div class="form-group">
          <label>Storage</label>
          <div id="storage-stats" class="storage-stats"></div>
          <button id="prune-btn" class="btn btn-ghost btn-sm">Prune old articles</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Cancel</button>
        <button id="save-settings" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Manage Feeds Modal -->
  <div id="manage-feeds-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h2>Manage Feeds</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="managed-feeds-list" class="managed-feeds-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Import/Export Modal -->
  <div id="import-export-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Import / Export</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <h3>Export</h3>
          <p class="text-muted">Download your subscriptions as OPML</p>
          <button id="export-opml-btn" class="btn btn-primary btn-full">Export OPML</button>
        </div>
        <hr>
        <div class="form-group">
          <h3>Import</h3>
          <p class="text-muted">Import subscriptions from an OPML file</p>
          <input type="file" id="import-opml-input" accept=".opml,.xml" class="hidden">
          <button id="import-opml-btn" class="btn btn-ghost btn-full">Choose OPML file</button>
          <div id="import-result" class="text-muted mt-2 hidden"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
