<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with shadow -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Note shape -->
  <path d="M30 20 L80 20 L98 38 L98 108 L30 108 Z" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Fold -->
  <path d="M80 20 L80 38 L98 38 Z" fill="#c7d2fe"/>
  
  <!-- Lines -->
  <line x1="42" y1="52" x2="86" y2="52" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="68" x2="86" y2="68" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="84" x2="70" y2="84" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pencil -->
  <g transform="translate(72, 42) rotate(45)">
    <rect x="-8" y="-16" width="16" height="32" rx="3" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
    <polygon points="0,20 -8,28 8,28" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
    <polygon points="0,20 -4,26 4,26" fill="#1e293b"/>
    <rect x="-8" y="-16" width="16" height="4" rx="1" fill="#f59e0b"/>
  </g>
  
  <!-- Q letter overlay -->
  <text x="64" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Q</text>
</svg>
