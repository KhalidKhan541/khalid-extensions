<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes - Side Panel</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .sidepanel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .sidepanel-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .sidepanel-content {
      padding: 16px;
    }

    .note-editor {
      width: 100%;
      min-height: 400px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
    }

    .note-editor:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="sidepanel-header">
    <h2>Quick Notes</h2>
  </div>
  <div class="sidepanel-content">
    <textarea class="note-editor" placeholder="Write your note here..."></textarea>
  </div>
  <script src="storage.js"></script>
  <script src="markdown.js"></script>
  <script>
    // Side panel basic functionality
    document.addEventListener('DOMContentLoaded', async () => {
      const editor = document.querySelector('.note-editor');

      // Load last active note
      const response = await chrome.runtime.sendMessage({ type: 'get-notes' });
      if (response.success && response.notes.length > 0) {
        editor.value = response.notes[0].content;
      }

      // Auto-save
      let saveTimeout;
      editor.addEventListener('input', () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
          if (response.success && response.notes.length > 0) {
            await chrome.runtime.sendMessage({
              type: 'update-note',
              id: response.notes[0].id,
              data: { content: editor.value }
            });
          }
        }, 500);
      });
    });
  </script>
</body>
</html>
