<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translate Now</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 5h7M5 2v3M3 14c0-4.418 2.239-8 5-8s5 3.582 5 8"/>
          <path d="M14 14l3-8 3 8M14.5 12h5"/>
          <path d="M7 20c0-2.761 1.797-5 4-5s4 2.239 4 5"/>
        </svg>
        <span>Translate Now</span>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="language-bar">
      <div class="lang-select-wrapper">
        <select id="sourceLang" class="lang-select"></select>
      </div>
      <button id="swapBtn" class="swap-btn" title="Swap languages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><path d="M3 12h18"/>
        </svg>
      </button>
      <div class="lang-select-wrapper">
        <select id="targetLang" class="lang-select"></select>
      </div>
    </section>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="text">Text</button>
      <button class="mode-btn" data-mode="document">Document</button>
      <button class="mode-btn" data-mode="history">History</button>
    </div>

    <main class="main-content">
      <div id="textMode" class="mode-panel active">
        <div class="input-area">
          <textarea id="inputText" placeholder="Enter text to translate..." rows="4"></textarea>
          <div class="input-actions">
            <button id="clearInput" class="action-btn" title="Clear">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
            <button id="pasteBtn" class="action-btn" title="Paste from clipboard">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
              </svg>
            </button>
            <button id="speakInputBtn" class="action-btn" title="Listen">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="translateBtn" class="translate-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 5h7M5 2v3"/><path d="M14 14l3-8 3 8M14.5 12h5"/>
          </svg>
          Translate
        </button>

        <div id="outputArea" class="output-area hidden">
          <div class="output-header">
            <span id="detectedLang" class="detected-lang"></span>
            <div class="output-actions">
              <button id="copyTranslation" class="action-btn" title="Copy translation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <button id="speakOutputBtn" class="action-btn" title="Listen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              </button>
              <button id="favoriteBtn" class="action-btn" title="Save to favorites">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="translationOutput" class="translation-output"></div>
          <div id="romanization" class="romanization hidden"></div>
        </div>

        <div class="learning-mode">
          <label class="toggle-label">
            <input type="checkbox" id="learningMode">
            <span class="toggle-slider"></span>
            Show both languages
          </label>
        </div>
      </div>

      <div id="documentMode" class="mode-panel">
        <div class="document-area">
          <p class="document-hint">Select text on any page to translate, or paste a document below:</p>
          <textarea id="documentInput" placeholder="Paste a long text or document to translate..." rows="8"></textarea>
          <button id="translateDocBtn" class="translate-btn">Translate Document</button>
          <div id="documentOutput" class="document-output hidden"></div>
        </div>
      </div>

      <div id="historyMode" class="mode-panel">
        <div class="history-tabs">
          <button class="history-tab active" data-tab="recent">Recent</button>
          <button class="history-tab" data-tab="favorites">Favorites</button>
        </div>
        <div id="recentList" class="history-list"></div>
        <div id="favoritesList" class="history-list hidden"></div>
        <button id="clearHistory" class="clear-btn">Clear History</button>
      </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="languages.js"></script>
  <script src="translator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
