<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Clipper Side Panel</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border-color: #e0e0e0;
      --accent-color: #4a90d9;
    }
    [data-theme="dark"] {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #2a2a4a;
      --accent-color: #4a90d9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 16px;
    }
    h2 { font-size: 16px; margin-bottom: 12px; }
    .clip-card {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .clip-card:hover { border-color: var(--accent-color); }
    .clip-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .clip-url { font-size: 11px; color: var(--accent-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-meta { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
    .empty { text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Recent Clips</h2>
  <div id="clipsList"></div>
  <script>
    async function loadClips() {
      const db = await new Promise((resolve, reject) => {
        const req = indexedDB.open('WebClipperDB', 1);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      const tx = db.transaction('clips', 'readonly');
      const store = tx.objectStore('clips');
      const clips = await new Promise((resolve) => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onprogress = () => resolve(req.result);
      });
      clips.sort((a, b) => (b.date || 0) - (a.date || 0));
      const list = document.getElementById('clipsList');
      if (clips.length === 0) {
        list.innerHTML = '<div class="empty">No clips yet.<br>Right-click any page to start clipping.</div>';
        return;
      }
      list.innerHTML = clips.slice(0, 50).map(clip => `
        <div class="clip-card" onclick="chrome.tabs.create({url:'${clip.url}'})">
          <div class="clip-title">${(clip.title || 'Untitled').replace(/</g, '&lt;')}</div>
          <div class="clip-url">${(clip.url || '').replace(/</g, '&lt;')}</div>
          <div class="clip-meta">${new Date(clip.date).toLocaleDateString()} · ${clip.collection || 'Uncategorized'}</div>
        </div>
      `).join('');
    }
    loadClips();
  </script>
</body>
</html>
